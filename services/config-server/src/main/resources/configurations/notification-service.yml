spring:
  data:
    mongodb:
      authentication-database: admin
      database: notification
      port: 27017
      host: localhost
      password: alibou
      username: alibou
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: paymentGroup,orderGroup
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.type.mapping: orderConfirmation:com.ainur.ecommerce.kafka.order.OrderConfirmation,paymentConfirmation:com.ainur.ecommerce.kafka.payment.PaymentConfirmation
  mail:
    host: localhost
    port: 1025
    username: alibou
    password: alibou
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          trust: "*"
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000
server:
  port: 8040